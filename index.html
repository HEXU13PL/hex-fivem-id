<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FiveM Server Browser</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-primary: #0a0a0c;
			--bg-secondary: #121216;
			--bg-card: #18181e;
			--bg-card-hover: #22222b;
			--border-color: #2a2a35;
			
			--accent-red: #e50914;
			--accent-red-hover: #ff1e27;
			--accent-red-glow: rgba(229, 9, 20, 0.25);
			
			--text-primary: #f1f1f5;
			--text-secondary: #8c8c9e;
			--text-muted: #5a5a6e;
			
			--online-color: #2ecc71;
			--offline-color: #e74c3c;
			
			--radius: 8px;
			--transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			background-color: var(--bg-primary);
			color: var(--text-primary);
			line-height: 1.6;
			min-height: 100vh;
			padding: 20px 0;
		}

		/* Layout Containers */
		main, header, footer, .tabs, .tab-content {
			max-width: 1100px;
			margin: 0 auto;
			padding: 0 20px;
		}

		header {
			padding: 24px 20px;
			border-bottom: 1px solid var(--border-color);
			background: linear-gradient(180deg, rgba(229, 9, 20, 0.08) 0%, rgba(10, 10, 12, 0) 100%);
			display: flex;
			justify-content: space-between;
			align-items: center;
			flex-wrap: wrap;
			gap: 15px;
			border-radius: var(--radius) var(--radius) 0 0;
		}

		.header-title-container {
			display: flex;
			align-items: center;
			gap: 12px;
		}

		#server-icon {
			width: 32px;
			height: 32px;
			border-radius: 6px;
			object-fit: cover;
		}

		h1, h2, h3 {
			color: var(--text-primary);
			font-weight: 700;
			letter-spacing: -0.5px;
		}

		h1 {
			font-size: 1.6rem;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		h1::before {
			content: '';
			display: inline-block;
			width: 4px;
			height: 24px;
			background-color: var(--accent-red);
			border-radius: 2px;
			box-shadow: 0 0 10px var(--accent-red);
		}

		.header-actions {
			display: flex;
			align-items: center;
			gap: 10px;
			position: relative;
		}

		/* Controls & Inputs */
		.controls-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-top: 20px;
			gap: 15px;
			flex-wrap: wrap;
		}

		.input-group {
			display: flex;
			gap: 8px;
			align-items: center;
		}

		input[type="text"], input[type="search"] {
			background-color: var(--bg-card);
			border: 1px solid var(--border-color);
			color: var(--text-primary);
			padding: 10px 16px;
			border-radius: var(--radius);
			font-size: 0.95rem;
			outline: none;
			transition: var(--transition);
		}

		input[type="text"]:focus, input[type="search"]:focus {
			border-color: var(--accent-red);
			box-shadow: 0 0 0 3px var(--accent-red-glow);
		}

		button, .btn {
			background-color: var(--bg-card);
			border: 1px solid var(--border-color);
			color: var(--text-primary);
			padding: 10px 18px;
			border-radius: var(--radius);
			font-weight: 600;
			font-size: 0.9rem;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			transition: var(--transition);
		}

		button:hover, .btn:hover {
			background-color: var(--bg-card-hover);
			border-color: var(--accent-red);
			color: #fff;
		}

		button.btn-primary, #server-id-button {
			background-color: var(--accent-red);
			border-color: var(--accent-red);
			color: #ffffff;
		}

		button.btn-primary:hover, #server-id-button:hover {
			background-color: var(--accent-red-hover);
			border-color: var(--accent-red-hover);
			box-shadow: 0 0 15px var(--accent-red-glow);
		}

		.icon-button {
			padding: 10px;
			aspect-ratio: 1;
		}

		.icon-button img {
			width: 18px;
			height: 18px;
			display: block;
			filter: invert(1);
		}

		/* Dropdown Menus */
		.dropdown-container {
			position: relative;
		}

		.dropdown-menu {
			position: absolute;
			top: 100%;
			right: 0;
			margin-top: 8px;
			width: 300px;
			background-color: var(--bg-card);
			border: 1px solid var(--border-color);
			border-radius: var(--radius);
			box-shadow: 0 10px 25px rgba(0,0,0,0.6);
			padding: 12px;
			z-index: 100;
			display: none;
		}

		.dropdown-menu.show {
			display: block;
			animation: fadeIn 0.2s ease;
		}

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(-8px); }
			to { opacity: 1; transform: translateY(0); }
		}

		.no-favorites {
			color: var(--text-muted);
			font-size: 0.9rem;
			text-align: center;
			padding: 10px 0;
		}

		.favorites-section h3 {
			font-size: 0.8rem;
			text-transform: uppercase;
			color: var(--text-secondary);
			margin-bottom: 8px;
			padding-bottom: 4px;
			border-bottom: 1px solid var(--border-color);
		}

		.favorites-section ul {
			list-style: none;
		}

		.favorite-item {
			width: 100%;
			text-align: left;
			background: transparent;
			border: none;
			padding: 8px 10px;
			color: var(--text-primary);
			border-radius: 4px;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.favorite-item:hover {
			background-color: var(--bg-card-hover);
		}

		/* Tabs System */
		.tabs {
			display: flex;
			gap: 10px;
			margin-top: 20px;
			border-bottom: 1px solid var(--border-color);
		}

		.tab-button {
			background: transparent;
			border: none;
			border-bottom: 2px solid transparent;
			border-radius: 0;
			padding: 12px 20px;
			color: var(--text-secondary);
		}

		.tab-button:hover {
			background: transparent;
			color: var(--text-primary);
		}

		.tab-button.active {
			border-bottom-color: var(--accent-red);
			color: #fff;
		}

		.tab-content {
			display: none;
		}

		.tab-content.active {
			display: block;
		}

		/* Table Design */
		.table-container {
			margin-top: 20px;
			background-color: var(--bg-secondary);
			border: 1px solid var(--border-color);
			border-radius: var(--radius);
			overflow: hidden;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
		}

		th {
			background-color: var(--bg-card);
			color: var(--text-secondary);
			font-size: 0.85rem;
			text-transform: uppercase;
			padding: 16px 20px;
			border-bottom: 1px solid var(--border-color);
		}

		td {
			padding: 14px 20px;
			border-bottom: 1px solid var(--border-color);
			font-size: 0.95rem;
			color: var(--text-primary);
		}

		tr:not(.table-footer):hover td {
			background-color: rgba(229, 9, 20, 0.04);
		}

		tr.player-online .table-ping { color: var(--online-color); }
		tr.player-offline .table-ping { color: var(--offline-color); opacity: 0.7; }

		.table-no {
			width: 60px;
			color: var(--text-muted);
		}

		.table-favorite {
			width: 50px;
			text-align: center;
			cursor: pointer;
		}

		.table-favorite img {
			width: 18px;
			height: 18px;
			vertical-align: middle;
		}

		.table-id {
			font-family: monospace;
			color: var(--text-secondary);
		}

		.table-socials {
			display: flex;
			gap: 10px;
			align-items: center;
		}

		.table-socials a img {
			width: 20px;
			height: 20px;
			opacity: 0.8;
			transition: var(--transition);
		}

		.table-socials a:hover img {
			opacity: 1;
			transform: scale(1.1);
		}

		.table-ping img {
			width: 12px;
			height: 12px;
			margin-right: 6px;
			vertical-align: middle;
		}

		.table-footer td {
			background-color: var(--bg-card);
			color: var(--text-muted);
			font-size: 0.85rem;
			text-align: center;
			padding: 20px;
		}

		.table-footer a {
			color: var(--accent-red);
			text-decoration: none;
			font-weight: 600;
		}

		.table-footer a:hover {
			text-decoration: underline;
		}

		/* Notifications */
		#notification-container {
			position: fixed;
			bottom: 20px;
			right: 20px;
			z-index: 1000;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.notification {
			background-color: var(--bg-card);
			border-left: 4px solid var(--accent-red);
			color: var(--text-primary);
			padding: 14px 20px;
			border-radius: var(--radius);
			box-shadow: 0 5px 20px rgba(0,0,0,0.6);
			display: flex;
			align-items: center;
			justify-content: space-between;
			min-width: 280px;
		}

		.notification.success { border-left-color: var(--online-color); }
		.notification.error { border-left-color: var(--accent-red); }
		.notification.info { border-left-color: #3498db; }

		.close-notification {
			background: none;
			border: none;
			color: var(--text-muted);
			font-size: 1.2rem;
			cursor: pointer;
			padding-left: 10px;
		}

		.close-notification:hover {
			color: var(--text-primary);
		}

		/* Loader */
		#loader {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background-color: rgba(10, 10, 12, 0.85);
			backdrop-filter: blur(4px);
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 999;
		}

		.spinner {
			width: 40px;
			height: 40px;
			border: 3px solid var(--border-color);
			border-top: 3px solid var(--accent-red);
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}

		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
	</style>
</head>
<body>

	<header>
		<div class="header-title-container">
			<img id="server-icon" src="https://fivem.net/favicon.png" alt="Server Icon" style="display: none;">
			<h1 id="server-name">FiveM Browser</h1>
		</div>
		<div class="header-actions">
			<div class="dropdown-container">
				<button id="history-button" class="icon-button" title="History">
					<img src="img/history.svg" alt="History">
				</button>
				<div id="history-menu" class="dropdown-menu"></div>
			</div>
			
			<div class="dropdown-container">
				<button id="favorites-button" class="icon-button" title="Favorites">
					<img src="img/star.svg" alt="Favorites">
				</button>
				<div id="favorites-menu" class="dropdown-menu"></div>
			</div>

			<button id="theme-toggle" class="icon-button" title="Toggle Theme">
				<img src="img/moon.svg" alt="Theme">
			</button>
		</div>
	</header>

	<main>
		<div class="controls-bar">
			<div class="input-group">
				<input type="text" id="server-id" placeholder="Server ID (e.g. vqkdxx)">
				<button id="server-id-button" class="btn-primary">Connect</button>
				<button id="refresh-button">Refresh</button>
			</div>

			<div class="input-group">
				<input type="search" id="search" placeholder="Search player or ID...">
			</div>
		</div>

		<div class="tabs">
			<button class="tab-button active" data-tab="players">Players List</button>
			<button class="tab-button" data-tab="favorites">Favorite Players</button>
			<button class="tab-button" data-tab="statistics">Statistics</button>
		</div>

		<!-- Players Tab -->
		<div id="players-tab" class="tab-content active">
			<div class="table-container">
				<table id="players-table">
					<thead>
						<tr id="table-header">
							<th class="table-no">#</th>
							<th class="table-favorite">Fav</th>
							<th class="table-id">ID</th>
							<th class="table-name">Name</th>
							<th class="table-socials">Identifiers</th>
							<th class="table-ping">Ping</th>
						</tr>
					</thead>
					<tbody>
						<!-- Player rows populated via JS -->
					</tbody>
				</table>
			</div>
		</div>

		<!-- Favorites Tab -->
		<div id="favorites-tab" class="tab-content">
			<div class="table-container">
				<table id="favorites-table">
					<thead>
						<tr id="favorites-table-header">
							<th class="table-no">#</th>
							<th class="table-favorite">Fav</th>
							<th class="table-id">Key</th>
							<th class="table-name">Name</th>
							<th class="table-socials">Socials</th>
							<th class="table-ping">Status</th>
						</tr>
					</thead>
					<tbody>
						<!-- Favorite player rows populated via JS -->
					</tbody>
				</table>
			</div>
		</div>

		<!-- Statistics Tab -->
		<div id="statistics-tab" class="tab-content">
			<div class="table-container" style="padding: 20px; text-align: center;">
				<h2>Server Statistics</h2>
				<p style="color: var(--text-secondary); margin-top: 10px;">Charts and analytics module</p>
			</div>
		</div>
	</main>

	<div id="loader" style="display: none;">
		<div class="spinner"></div>
	</div>

	<div id="notification-container"></div>

	<script type="module" src="./src/index.js"></script>
</body>
</html>
